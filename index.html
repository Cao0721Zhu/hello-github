<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello, GitHub</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-soft: rgba(88, 166, 255, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2430 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid rgba(88, 166, 255, 0.3);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.04em;
  }
  h1 {
    margin: 18px 0 8px;
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  p { color: var(--muted); line-height: 1.7; margin: 0 0 20px; font-size: 15px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 14px;
    color: #0d1117;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.97); }
  .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  footer {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">● starter</span>
    <h1>你好，GitHub 👋</h1>
    <p>这是一个占位小页面，放进来只是为了让你在这个工作区里有东西可看。点一下按钮，它就记一次。</p>
    <div class="row">
      <button id="tap">点我一下</button>
      <span class="count" id="count">已点击 0 次</span>
    </div>
    <footer>
      <span id="clock">--:--:--</span>
      <span>index.html</span>
    </footer>
  </main>

<script>
  let n = 0;
  const countEl = document.getElementById('count');
  document.getElementById('tap').addEventListener('click', () => {
    n += 1;
    countEl.textContent = `已点击 ${n} 次`;
  });

  const clockEl = document.getElementById('clock');
  const tick = () => {
    clockEl.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  };
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
